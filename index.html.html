<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

const TABS = ['MR analysis','Chemist & retail','Supply chain','Doctors — GP','Doctors — specialist','Brand managers','Cross-stakeholder insights'];

const tabBar = document.getElementById('tabBar');
const sectionsDiv = document.getElementById('sections');

TABS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className='tab'+(i===0?' active':'');
  btn.textContent=t;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+i).classList.add('active');
  };
  tabBar.appendChild(btn);
  const sec = document.createElement('div');
  sec.className='section'+(i===0?' active':'');
  sec.id='sec-'+i;
  sectionsDiv.appendChild(sec);
});

function mkCanvas(id,h=200){
  return `<div style="position:relative;height:${h}px"><canvas id="${id}" role="img" aria-label="chart"></canvas></div>`;
}
function mkChart(id,type,labels,datasets,opts={}){
  const el=document.getElementById(id);
  if(!el)return;
  const dflt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
  new Chart(el,{type,data:{labels,datasets},options:{...dflt,...opts}});
}
function hBar(label,val,max,color){
  const pct=Math.round(val/max*100);
  return `<div class="bar-h"><div class="label"><span>${label}</span><span>${val}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${color}">${pct>18?val:''}</div></div></div>`;
}

<p class="section-title">Key cross-stakeholder concordances & divergences</p>

<div class="insight-box"><b>Brand substitution gap:</b> MRs report substitution happens "often" (8/22) to "sometimes" (9/22), while chemists confirm it's driven primarily by non-availability and margin, not patient demand. Yet GPs rarely permit substitution in writing — this gap represents a key compliance risk for pharma brands.</div>

<div class="insight-box"><b>Efficacy consensus across all prescription-side stakeholders:</b> MRs, GPs, specialists, and brand managers all rank clinical efficacy as the #1 factor in molecule/brand choice. This is the one consistent signal across 4 different survey populations, validating efficacy-led messaging as the single most effective strategy.</div>

<div class="insight-box"><b>MR visit frequency vs doctor expectations:</b> GPs receive 20–130+ MR contacts/month. Most GPs tolerate 20–40/month and value monthly or weekly visits. MRs report daily or alternate-day chemist coverage but the perceived value by GPs is concentrated in scientific content and samples — not frequency itself.</div>

<div class="insight-box"><b>Supply chain stress converging at stockist:</b> Stockists face pressure from both ends — pharma companies (inconsistent dispatch, short supply) and retailers (non-availability complaints). Only 1 of 5 stockists reported no major issues. Chemists rate stock availability as their #1 desirability factor, yet stockists cite "very difficult" partial order fulfilment from companies.</div>

<div class="insight-box"><b>PCOS and lifestyle disease surge — universal signal:</b> All 20 specialist gynecologists and 70%+ of GPs independently flagged rising PCOS, lifestyle diseases, and mental-health-linked conditions as major emerging patterns. Brand managers in relevant therapy areas should note this aligns with a genuine epidemiological shift, not demand creation.</div>

<div class="insight-box"><b>ASHA workers are an underdeveloped channel:</b> All 3 ASHA workers surveyed actively explain medicines and encourage adherence, but face low incentives, irregular pay, and medicine stockouts blamed on them by patients. They interact daily with PHC staff and weekly with ANMs — making them potential influencers for generics and government programs that pharma companies largely ignore.</div>

<div class="insight-box"><b>Government hospital vs private hospital divide:</b> Govt hospitals universally report supply delays and essential-medicine shortages, defaulting to prescribing alternatives or advising outside purchases. Private hospitals use approved formulary lists and are responsive to MR detailing that provides CME and unbiased data — aggressive promotion is explicitly disliked in both settings.</div>
